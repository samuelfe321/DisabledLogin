<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Dynamite Systems</title>
  <link rel="stylesheet" href="css style/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body data-theme="standard" data-tts="off">
  <div class="access-toggle" role="region" aria-label="Accessibility options">
    <button id="themeBtn" title="Toggle Dark Mode" aria-label="Dark Mode" aria-pressed="false">
      <span class="sr-only">Dark Mode</span>
      <span aria-hidden="true">Dark Mode</span>
    </button>
    <button id="ttsBtn" title="Toggle Text-to-Speech" aria-label="Text-to-Speech" aria-pressed="false">
      <span class="sr-only">Text-to-Speech</span>
      <span aria-hidden="true">TTS</span>
    </button>
  </div>

  <main>
    <form id="loginForm" novalidate>
      <div class="login-header">
        <h1>Dynamite Systems</h1>
        <h1>Login</h1>
        <p>Secure access</p>
      </div>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com" />
      </div>
      <div class="field password-field">
        <label for="loginPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" required minlength="8" maxlength="12" placeholder="••••••••" />
          <button type="button" class="toggle-password" aria-label="Show password">
            <i class="fa fa-eye"></i>
          </button>
        </div>
      </div>
      <p class="forgot-password">
        <a href="#" id="forgotLink">Forgot Password?</a>
      </p>
      <button type="submit" class="submit-btn">Sign In</button>

      <!-- OAuth Buttons -->
      <div class="oauth-group">
        <p class="oauth-or">or continue with</p>
        <div class="oauth-buttons">
          <button type="button" class="oauth-btn google" onclick="oauthLogin('google')">
            <i class="fab fa-google"></i> Google
          </button>
          <button type="button" class="oauth-btn apple" onclick="oauthLogin('apple')">
            <i class="fab fa-apple"></i> Apple
          </button>
          <button type="button" class="oauth-btn microsoft" onclick="oauthLogin('microsoft')">
            <i class="fab fa-microsoft"></i> Microsoft
          </button>
        </div>
      </div>

      <p class="create-account">
        <a href="reg.html">Create Account</a>
      </p>
    </form>
  </main>

  <!-- Reset Password Modal -->
  <div id="resetModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close">×</button>
      <h2>Forgot Password</h2>
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" required placeholder="you@example.com" />
        </div>
        <button type="submit" class="submit-btn">Send Reset Link</button>
      </form>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
