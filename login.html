<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="css style/style.css" />
    <link rel="stylesheet" href="css style/access.css" />
  </head>

  <body data-theme="standard" data-text="normal">
    <div class="access-toggle" role="region" aria-label="Accessibility options">
      <button
        id="contrastBtn"
        title="Toggle High Contrast"
        aria-label="High Contrast Mode"
        aria-pressed="false"
      >
        <span class="sr-only">High Contrast</span>
        <span aria-hidden="true">High Contrast</span>
      </button>
      <button
        id="textBtn"
        title="Toggle Large Text"
        aria-label="Large Text Mode"
        aria-pressed="false"
      >
        <span class="sr-only">Large Text</span>
        <span aria-hidden="true">Large Text</span>
      </button>
    </div>

    <main>
      <form action="" novalidate>
        <div class="login-header">
          <h1>Login</h1>
          <p>Secure access</p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            required
            placeholder="you@example.com"
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
          />
        </div>

        <button type="submit" class="submit-btn">Sign In</button>

        <p class="create-account">
          <a href="reg.html">Create Account</a>
        </p>
      </form>
    </main>
    <script src="js/login.js"></script>
  </body>
</html>
